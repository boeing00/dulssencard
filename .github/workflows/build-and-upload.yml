name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets 컨텍스트는 step 의 `if:` 에서 쓸 수 없다. 잡 레벨 env 로 한 번 받아 두고
    # 아래에서 env 를 검사한다. 시크릿이 없으면 빈 문자열이 된다.
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 파서가 깨진 APK 를 받아 가는 것보다 빌드가 실패하는 편이 낫다.
    - name: Run unit tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # ★ 첨부를 GCS 보다 **먼저** 한다.
    # 원래는 GCS 업로드 뒤에 있었는데, 시크릿이 없어 인증이 실패하면 이 단계까지 건너뛰어
    # APK 가 빌드됐는데도 받을 곳이 없었다. GCS 는 선택 기능이므로 필수 경로에 두지 않는다.
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: dulssencard-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    # 아래는 GCS 버킷을 쓸 때만 돈다. 시크릿이 없으면 통째로 건너뛰고, 워크플로는 성공한다.
    - name: Authenticate to Google Cloud
      id: gcp_auth
      if: github.event_name != 'pull_request' && env.GCP_SA_KEY != ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      if: steps.gcp_auth.outcome == 'success'
      uses: google-github-actions/setup-gcloud@v2

    - name: Upload APK to Google Cloud Storage
      if: steps.gcp_auth.outcome == 'success'
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        APK_NAME="dulssencard-debug-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}.apk"
        gsutil cp "$APK_PATH" "gs://${GCS_BUCKET_NAME}/$APK_NAME"
        echo "Uploaded: gs://${GCS_BUCKET_NAME}/$APK_NAME"
