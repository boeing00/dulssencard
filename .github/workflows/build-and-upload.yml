name: Build and Upload APK to Google Cloud Storage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Upload APK to Google Cloud Storage
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        APK_NAME="dulssencard-debug-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}.apk"
        
        gsutil cp "$APK_PATH" "gs://${{ secrets.GCS_BUCKET_NAME }}/$APK_NAME"
        
        echo "APK uploaded to: gs://${{ secrets.GCS_BUCKET_NAME }}/$APK_NAME"
        echo "Public URL: https://storage.googleapis.com/${{ secrets.GCS_BUCKET_NAME }}/$APK_NAME"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: dulssencard-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
