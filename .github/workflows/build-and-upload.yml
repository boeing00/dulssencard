name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets 컨텍스트는 step 의 `if:` 에서 쓸 수 없다. 잡 레벨 env 로 한 번 받아 두고
    # 아래에서 env 를 검사한다. 시크릿이 없으면 빈 문자열이 된다.
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    # Gradle 캐시와 래퍼 검증. Robolectric 이 첫 실행 때 받는 android-all 도 여기서 캐시된다.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 금융 수치 집계는 테스트 누락이 가장 위험하다. 매 PR 마다 전부 돈다:
    #  - 파서·집계·중복 판정 회귀, 결제 알림 코퍼스
    #  - Room 마이그레이션 테스트(v1→최신, Robolectric — 에뮬레이터 불필요)
    #  - 트랜잭션 원자성, 백업 암호·충돌 정책
    #  - 공개 저장소 개인정보 검사(AnonymizationGuardTest)
    - name: Unit tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon

    - name: Lint
      run: ./gradlew :app:lintDebug --no-daemon

    # 실패했을 때 원인을 볼 수 있게 보고서를 남긴다.
    - name: Upload test and lint reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          app/build/reports/tests/
          app/build/reports/lint-results-debug.html
        retention-days: 14

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # ★ 첨부를 GCS 보다 **먼저** 한다.
    # 원래는 GCS 업로드 뒤에 있었는데, 시크릿이 없어 인증이 실패하면 이 단계까지 건너뛰어
    # APK 가 빌드됐는데도 받을 곳이 없었다. GCS 는 선택 기능이므로 필수 경로에 두지 않는다.
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v7
      with:
        name: dulssencard-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    # 아래는 GCS 버킷을 쓸 때만 돈다. 시크릿이 없으면 통째로 건너뛰고, 워크플로는 성공한다.
    - name: Authenticate to Google Cloud
      id: gcp_auth
      if: github.event_name != 'pull_request' && env.GCP_SA_KEY != ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      if: steps.gcp_auth.outcome == 'success'
      uses: google-github-actions/setup-gcloud@v2

    - name: Upload APK to Google Cloud Storage
      if: steps.gcp_auth.outcome == 'success'
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        APK_NAME="dulssencard-debug-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}.apk"
        gsutil cp "$APK_PATH" "gs://${GCS_BUCKET_NAME}/$APK_NAME"
        echo "Uploaded: gs://${GCS_BUCKET_NAME}/$APK_NAME"
