org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 bundles Kotlin and forbids applying the kotlin-android plugin (newDsl).
# KSP (the Room compiler) registers its generated sources through kotlin.sourceSets,
# which built-in Kotlin rejects by default. This flag is the workaround AGP itself
# points at; drop it once the KSP/AGP integration lands.
android.disallowKotlinSourceSets=false
